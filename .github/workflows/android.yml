name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install
        working-directory: mobile
        run: npm install
      - name: Write config from secrets
        working-directory: mobile
        env:
          SUBHA_APP_URL: ${{ secrets.SUBHA_APP_URL }}
          SUBHA_ACCESS_TOKEN: ${{ secrets.SUBHA_ACCESS_TOKEN }}
        run: node scripts/make-config.js
      - name: Add Android + patch
        working-directory: mobile
        run: |
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android
      - name: App icons
        working-directory: mobile
        run: |
          pip install pillow
          python3 scripts/apply_icons.py android
      - name: Build debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SubhaAI-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
