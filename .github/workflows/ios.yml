name: Build iOS IPA (unsigned)
on:
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install
        working-directory: mobile
        run: npm install
      - name: Write config from secrets
        working-directory: mobile
        env:
          SUBHA_APP_URL: ${{ secrets.SUBHA_APP_URL }}
          SUBHA_ACCESS_TOKEN: ${{ secrets.SUBHA_ACCESS_TOKEN }}
        run: node scripts/make-config.js
      - name: Add iOS + patch
        working-directory: mobile
        run: |
          npx cap add ios
          node scripts/patch-ios.js
          npx cap sync ios
      - name: Archive (no signing)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath build/App.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Make IPA
        working-directory: mobile/ios/App
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qr SubhaAI-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SubhaAI-unsigned-ipa
          path: mobile/ios/App/SubhaAI-unsigned.ipa
